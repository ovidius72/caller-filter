name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The fast loop. The core is pure logic with no platform dependency, so its
  # tests need no device or simulator. Keep this job quick — it is the feedback
  # every platform shares, and a bug here is a bug everywhere at once.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (host only, no device)
        run: cargo test --all

      # Project Guidelines §1 is the project's central rule and the easiest to
      # break by accident. Enforced mechanically rather than trusted to review.
      - name: No hardcoded numbering or place data
        run: ./tools/check-no-hardcoded-numbering.sh

      # Place names and number metadata must come from the same libphonenumber
      # release. When they drift the geocoder names prefixes the expander
      # rejects, and a rule written against a city stops matching with nothing
      # logged and nothing on screen to explain it.
      - name: Vendored data is consistent and attributed
        run: ./tools/check-vendored-data.sh

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen

      # Builds three iOS slices, generates the Swift bindings and packages the
      # XCFramework. Bindings are produced here and never committed.
      - name: Build core and bindings
        run: ./tools/build-ios.sh

      - name: Generate Xcode project
        run: |
          # CI has no signing identity, so supply a placeholder team and build
          # unsigned. Real signing happens on a developer machine from
          # apps/ios/.env, which is gitignored.
          echo "DEVELOPMENT_TEAM=" > apps/ios/.env
          cd apps/ios && xcodegen generate

      - name: Build app and both extensions
        # Release, not Debug: Xcode 26 Debug builds put target code in a separate
        # __preview.dylib, leaving the extension's principal class out of the
        # .appex so it fails to enable on device.
        run: |
          cd apps/ios
          xcodebuild -project CallerFilter.xcodeproj -scheme CallerFilter \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # The iOS extensions run under tight memory limits, so an oversized core
      # makes them unviable regardless of correctness. Judge from LINKED
      # binaries — the static .a is pre-link noise and tells you nothing.
      - name: Report binary sizes
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData apps/ios -name 'CallerFilter.app' -type d 2>/dev/null | head -1)
          [ -z "$APP" ] && { echo "app not found, skipping size report"; exit 0; }
          { echo "### iOS linked binary sizes"; echo; echo '| binary | size |'; echo '|---|---:|';
            for b in "$APP/CallerFilter" "$APP"/PlugIns/*.appex/*; do
              [ -f "$b" ] && [ -x "$b" ] && echo "| $(basename "$b") | $(du -h "$b" | cut -f1) |"
            done
            echo "| whole .app | $(du -sh "$APP" | cut -f1) |"; } >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # Pinned deliberately. The dev machine runs JDK 26, which AGP 8.x and
          # Gradle 8.x cannot use; 21 is the widely supported choice and keeps CI
          # independent of whatever a developer happens to have installed.
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk

      - name: Install NDK
        run: sdkmanager --install "ndk;29.0.14206865"

      # Builds three ABIs and generates the Kotlin bindings. Note the bindings
      # come from the HOST library: the release profile strips, and stripping
      # removes UniFFI's metadata from an ELF object. Mach-O keeps it, which is
      # why the iOS job can read its own artifact.
      - name: Build core and bindings
        run: ./tools/build-android.sh

      - name: Build app
        run: cd apps/android && gradle :app:assembleDebug

      - name: Report core size per ABI
        run: |
          { echo "### Android core size per ABI"; echo; echo '| abi | size |'; echo '|---|---:|';
            find apps/android/app/generated/jniLibs -name '*.so' | while read -r f; do
              echo "| $(basename "$(dirname "$f")") | $(du -h "$f" | cut -f1) |"
            done; } >> "$GITHUB_STEP_SUMMARY"

# NOT AUTOMATED, deliberately: tools/entry-limit-harness. It measures the iOS
# Call Directory cap and needs a real iPhone plus human observation of memory and
# kill behaviour. Run it by hand when testing a new device or iOS version.
#
# Also not here yet: the dataset converter (F003). When it lands, add a step that
# runs it and FAILS THE BUILD on validation errors — a silently truncated dataset
# makes rules stop matching with no error anywhere, which is close to undebuggable.
