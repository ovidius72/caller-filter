[package]
name = "callerfilter-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared call and SMS filtering engine. All filtering logic lives here."

[lib]
name = "callerfilter_core"
# rlib for host tests; staticlib/cdylib for iOS linking and the Android JNI.
crate-type = ["lib", "staticlib", "cdylib"]

# Bindings are generated by this binary during the build and never committed.
# uniffi_bindgen is a library with no binary of its own, so the generator has to
# live in our crate.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# CFNM v1 serializes this dependency's DTO. Upgrade only with the golden test.
phonenumber = "=0.3.10"
uniffi = { workspace = true }
postcard = { version = "1", features = ["alloc", "use-std"] }
