name: LimitTest
options:
  bundleIdPrefix: com.antoniopantano.limittest
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_DEBUG_DYLIB: NO
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  LimitTest:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: HarnessFixture.json
        buildPhase: resources
    dependencies:
      - target: CallDir
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoniopantano.limittest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    info:
      path: App/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  CallDir:
    type: app-extension
    platform: iOS
    sources:
      - CallDir
      - Shared
      - path: HarnessFixture.json
        buildPhase: resources
    info:
      path: CallDir/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoniopantano.limittest.calldir
