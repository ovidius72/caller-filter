name: LimitTest
options:
  bundleIdPrefix: com.antoniopantano.limittest
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  LimitTest:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: CallDir
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoniopantano.limittest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  CallDir:
    type: app-extension
    platform: iOS
    sources: [CallDir]
    info:
      path: CallDir/Info.plist
      properties:
        LimitTestN: "1900000"
        LimitTestMode: identification
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoniopantano.limittest.calldir
