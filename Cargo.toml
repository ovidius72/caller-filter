[workspace]
resolver = "2"
members = ["core", "datasets"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.dependencies]
phonenumber = "0.3"
uniffi = { version = "0.32", features = ["cli"] }

[profile.release]
# The iOS Call Directory and SMS filter extensions run under tight memory
# limits, so the core's size matters more than in an ordinary app.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Bindings are generated by reading UniFFI's metadata out of a built library.
# Stripping removes that metadata from an ELF object, so a stripped build cannot
# be used for it. Mach-O keeps the metadata, which hides the problem on macOS
# and breaks on Linux.
#
# This profile exists only to carry that metadata. It is never shipped, so it
# skips optimisation and debug info to stay fast.
[profile.bindings]
inherits = "dev"
strip = false
debug = false
opt-level = 0
